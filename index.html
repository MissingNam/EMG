<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMG BLE</title>
<style>
  :root { --bg:#10141a; --card:#1a212b; --fg:#e6edf3; --mut:#8b98a8; --acc:#3fb6ff; --ok:#3ddc84; --bad:#ff5d5d; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px 12px 24px; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  h1 { font-size:18px; margin:0 0 8px; }
  #status { color:var(--mut); margin-bottom:10px; min-height:1.4em; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  button { background:var(--card); color:var(--fg); border:1px solid #2c3746; border-radius:8px; padding:10px 14px; font-size:15px; }
  button.primary { background:var(--acc); color:#04121c; border-color:var(--acc); font-weight:600; }
  button:disabled { opacity:.4; }
  #plotwrap { background:var(--card); border-radius:10px; padding:6px; margin-bottom:10px; }
  canvas { width:100%; height:38vh; min-height:200px; display:block; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-bottom:10px; }
  @media (min-width:640px) { .grid { grid-template-columns:repeat(4, 1fr); } }
  .m { background:var(--card); border-radius:10px; padding:8px 10px; }
  .m b { display:block; font-size:12px; font-weight:400; color:var(--mut); }
  .m span { font-size:20px; font-variant-numeric:tabular-nums; }
  #act { font-weight:700; }
  .opts { background:var(--card); border-radius:10px; padding:10px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  .opts label { display:flex; gap:6px; align-items:center; color:var(--mut); }
  .opts input[type=number] { width:70px; background:var(--bg); color:var(--fg); border:1px solid #2c3746; border-radius:6px; padding:6px; font-size:15px; }
  .opts input[type=checkbox] { width:18px; height:18px; }
  #warn { color:var(--bad); }
</style>
</head>
<body>
<h1>EMG por BLE</h1>
<div id="status">Desconectado</div>
<div id="warn"></div>

<div class="row">
  <button id="btnConnect" class="primary">Conectar</button>
  <button id="btnDisc" disabled>Desconectar</button>
  <button id="btnFreeze">Congelar</button>
  <button id="btnCal" disabled>Calibrar reposo (3 s)</button>
  <button id="btnCsv" disabled>Guardar CSV</button>
  <button id="btnClear">Limpiar</button>
</div>

<div id="plotwrap"><canvas id="plot"></canvas></div>

<div class="grid">
  <div class="m"><b>RMS (200 ms), cuentas</b><span id="vRms">-</span></div>
  <div class="m"><b>RMS en la entrada, mV</b><span id="vRmsMv">-</span></div>
  <div class="m"><b>Actividad</b><span id="act">-</span></div>
  <div class="m"><b>Pico a pico (ventana), cuentas</b><span id="vPp">-</span></div>
  <div class="m"><b>Muestras/s</b><span id="vRate">-</span></div>
  <div class="m"><b>Paquetes</b><span id="vPkt">0</span></div>
  <div class="m"><b>Perdidos</b><span id="vLost">0</span></div>
  <div class="m"><b>Muestras guardadas</b><span id="vLog">0</span></div>
</div>

<div class="opts">
  <label><input type="checkbox" id="optDc" checked> Quitar DC</label>
  <label><input type="checkbox" id="optNotch"> Notch 60 Hz</label>
  <label>Ganancia total <input type="number" id="optGain" value="10" min="1" step="1"></label>
  <label>Umbral (x reposo) <input type="number" id="optThr" value="3" min="1" step="0.5"></label>
</div>

<script>
'use strict';
const SERVICE_UUID = 'a1e60001-7c3d-4b6a-9d2e-3f5b8c1d0001';
const CHAR_UUID    = 'a1e60002-7c3d-4b6a-9d2e-3f5b8c1d0001';
const FS = 860;                  // Hz, ADS1115 a 860 SPS (el real varia hasta ~10 %)
const WINDOW_S = 4;              // segundos visibles
const BUF_N = FS * WINDOW_S;
const DC_ALPHA = 0.002;          // seguidor de DC (corte ~0.3 Hz)
const ADC_MAX = 32768, ADC_VREF = 0.256;   // ADS1115 int16, PGA +-0.256 V

const $ = id => document.getElementById(id);

// ---------- Estado ----------
let device = null, server = null, charac = null, wakeLock = null;
const ring = new Float32Array(BUF_N);
let head = 0, filled = 0;
let frozen = false;
let lastSeq = null, pktCount = 0, lostCount = 0, rateCount = 0, rateT0 = performance.now(), rate = 0;
let dc = null;
let baseline = null, calibrating = false, calEnd = 0, calVals = [];
let rmsNow = 0;
let ymin = -50, ymax = 50;

// Registro crudo (Uint16 por bloques)
const CHUNK = 65536;
let logChunks = [new Int16Array(CHUNK)], logPos = 0, logTotal = 0;
function logSample(v) {
  if (logPos === CHUNK) { logChunks.push(new Int16Array(CHUNK)); logPos = 0; }
  logChunks[logChunks.length - 1][logPos++] = v;
  logTotal++;
}

// ---------- Notch (biquad) ----------
function makeNotch(f0, fs, Q) {
  const w0 = 2 * Math.PI * f0 / fs, c = Math.cos(w0), al = Math.sin(w0) / (2 * Q);
  const a0 = 1 + al;
  const b0 = 1 / a0, b1 = -2 * c / a0, b2 = 1 / a0, a1 = -2 * c / a0, a2 = (1 - al) / a0;
  let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  return x => {
    const y = b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
    x2 = x1; x1 = x; y2 = y1; y1 = y;
    return y;
  };
}
const notch = makeNotch(60, FS, 30);

// ---------- Procesamiento ----------
function pushSample(raw) {
  logSample(raw);
  rateCount++;
  let y = raw;
  if ($('optDc').checked) {
    if (dc === null) dc = raw;
    dc += (raw - dc) * DC_ALPHA;
    y = raw - dc;
  }
  if ($('optNotch').checked) y = notch(y);
  ring[head] = y;
  head = (head + 1) % BUF_N;
  if (filled < BUF_N) filled++;
}

function onData(ev) {
  const dv = ev.target.value;
  const len = dv.byteLength;
  if (len < 4) return;
  const seq = dv.getUint16(0, true);
  if (lastSeq !== null) {
    const exp = (lastSeq + 1) & 0xFFFF;
    if (seq !== exp) lostCount += (seq - exp) & 0xFFFF;
  }
  lastSeq = seq;
  pktCount++;
  const n = (len - 2) >> 1;
  for (let i = 0; i < n; i++) pushSample(dv.getInt16(2 + 2 * i, true));
}

// ---------- BLE ----------
function setStatus(t) { $('status').textContent = t; }

async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}

async function connect() {
  try {
    setStatus('Buscando dispositivo...');
    if (!device) {
      device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
      device.addEventListener('gattserverdisconnected', onDisconnected);
    }
    setStatus('Conectando a ' + (device.name || 'dispositivo') + '...');
    server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE_UUID);
    charac = await svc.getCharacteristic(CHAR_UUID);
    charac.addEventListener('characteristicvaluechanged', onData);
    await charac.startNotifications();
    lastSeq = null; dc = null;
    $('btnConnect').disabled = true;
    $('btnDisc').disabled = false;
    $('btnCal').disabled = false;
    setStatus('Conectado a ' + (device.name || 'dispositivo'));
    keepAwake();
  } catch (e) {
    setStatus('Error: ' + (e && e.message ? e.message : e));
    $('btnConnect').disabled = false;
  }
}

function onDisconnected() {
  setStatus('Desconectado (toca Conectar para reintentar)');
  $('btnConnect').disabled = false;
  $('btnDisc').disabled = true;
  $('btnCal').disabled = true;
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}

function disconnect() {
  if (device && device.gatt.connected) device.gatt.disconnect();
}

// ---------- CSV ----------
function saveCsv() {
  if (logTotal === 0) return;
  const parts = ['n,t_s,cuentas_adc,volts_adc\n'];
  let n = 0, buf = [];
  for (let c = 0; c < logChunks.length; c++) {
    const arr = logChunks[c];
    const lim = (c === logChunks.length - 1) ? logPos : CHUNK;
    for (let i = 0; i < lim; i++, n++) {
      const v = arr[i];
      buf.push(n + ',' + (n / FS).toFixed(3) + ',' + v + ',' + (v * ADC_VREF / ADC_MAX).toFixed(4));
      if (buf.length >= 20000) { parts.push(buf.join('\n') + '\n'); buf = []; }
    }
  }
  if (buf.length) parts.push(buf.join('\n') + '\n');
  const blob = new Blob(parts, { type: 'text/csv' });
  const d = new Date(), p = x => String(x).padStart(2, '0');
  const name = 'emg_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.csv';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

function clearAll() {
  ring.fill(0); head = 0; filled = 0;
  logChunks = [new Int16Array(CHUNK)]; logPos = 0; logTotal = 0;
  pktCount = 0; lostCount = 0; lastSeq = null; dc = null;
  baseline = null; ymin = -50; ymax = 50;
}

// ---------- Grafica ----------
const cv = $('plot');
const ctx = cv.getContext('2d');
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(100, Math.floor(cv.clientWidth * dpr));
  cv.height = Math.max(100, Math.floor(cv.clientHeight * dpr));
}
window.addEventListener('resize', resize);
resize();

function draw() {
  requestAnimationFrame(draw);
  if (frozen) return;
  const W = cv.width, H = cv.height, dpr = window.devicePixelRatio || 1;
  ctx.fillStyle = '#1a212b';
  ctx.fillRect(0, 0, W, H);
  if (filled < 2) return;

  const n = filled, start = (head - n + BUF_N) % BUF_N;
  const mins = new Float32Array(W).fill(Infinity);
  const maxs = new Float32Array(W).fill(-Infinity);
  let gmin = Infinity, gmax = -Infinity;
  for (let j = 0; j < n; j++) {
    const v = ring[(start + j) % BUF_N];
    const col = Math.min(W - 1, Math.floor((BUF_N - n + j) * W / BUF_N));
    if (v < mins[col]) mins[col] = v;
    if (v > maxs[col]) maxs[col] = v;
    if (v < gmin) gmin = v;
    if (v > gmax) gmax = v;
  }
  // escala automatica: crece de inmediato, se contrae despacio
  ymin = gmin < ymin ? gmin : ymin + (gmin - ymin) * 0.03;
  ymax = gmax > ymax ? gmax : ymax + (gmax - ymax) * 0.03;
  let lo = ymin, hi = ymax;
  if (hi - lo < 20) { const m = (hi + lo) / 2; lo = m - 10; hi = m + 10; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const Y = v => H - (v - lo) / (hi - lo) * H;

  // rejilla
  ctx.strokeStyle = '#2c3746'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let s = 1; s < WINDOW_S; s++) { const x = Math.round(s * W / WINDOW_S) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  if (lo < 0 && hi > 0) { const y = Math.round(Y(0)) + 0.5; ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // senal (envolvente min-max por columna)
  ctx.strokeStyle = '#3fb6ff'; ctx.lineWidth = Math.max(1, dpr);
  ctx.beginPath();
  for (let c = 0; c < W; c++) {
    if (mins[c] === Infinity) continue;
    const x = c + 0.5;
    let y1 = Y(maxs[c]), y2 = Y(mins[c]);
    if (y2 - y1 < 1) { y1 -= 0.5; y2 += 0.5; }
    ctx.moveTo(x, y1); ctx.lineTo(x, y2);
  }
  ctx.stroke();

  // etiquetas
  ctx.fillStyle = '#8b98a8';
  ctx.font = (11 * dpr) + 'px system-ui, sans-serif';
  ctx.fillText(hi.toFixed(0), 4 * dpr, 12 * dpr);
  ctx.fillText(lo.toFixed(0), 4 * dpr, H - 4 * dpr);
  ctx.fillText(WINDOW_S + ' s', W - 30 * dpr, H - 4 * dpr);
}
requestAnimationFrame(draw);

// ---------- Metricas (5 Hz) ----------
setInterval(() => {
  const now = performance.now();
  const dt = (now - rateT0) / 1000;
  if (dt >= 1) { rate = rateCount / dt; rateCount = 0; rateT0 = now; }

  const m = Math.min(200, filled);
  if (m >= 10) {
    let s = 0;
    for (let k = 0; k < m; k++) { const v = ring[(head - 1 - k + BUF_N) % BUF_N]; s += v * v; }
    rmsNow = Math.sqrt(s / m);
    const gain = Math.max(1, parseFloat($('optGain').value) || 1);
    const rmsMv = rmsNow * ADC_VREF / ADC_MAX / gain * 1000;
    $('vRms').textContent = rmsNow.toFixed(1);
    $('vRmsMv').textContent = rmsMv.toFixed(3);
    $('vPp').textContent = (ymax - ymin).toFixed(0);
  }
  $('vRate').textContent = rate.toFixed(0);
  $('vPkt').textContent = pktCount;
  const tot = pktCount + lostCount;
  $('vLost').textContent = lostCount + (tot ? ' (' + (100 * lostCount / tot).toFixed(1) + '%)' : '');
  $('vLog').textContent = logTotal;
  $('btnCsv').disabled = logTotal === 0;

  if (calibrating) {
    calVals.push(rmsNow);
    if (now >= calEnd) {
      calibrating = false;
      baseline = calVals.reduce((a, b) => a + b, 0) / Math.max(1, calVals.length);
      $('btnCal').textContent = 'Calibrar reposo (3 s)';
    } else {
      $('btnCal').textContent = 'Calibrando... ' + Math.ceil((calEnd - now) / 1000) + ' s';
    }
  }
  const act = $('act');
  if (calibrating) { act.textContent = 'Calibrando'; act.style.color = '#8b98a8'; }
  else if (baseline === null || baseline <= 0) { act.textContent = 'Sin calibrar'; act.style.color = '#8b98a8'; }
  else {
    const thr = Math.max(1, parseFloat($('optThr').value) || 3);
    const ratio = rmsNow / baseline;
    const on = ratio >= thr;
    act.textContent = (on ? 'ACTIVO ' : 'REPOSO ') + ratio.toFixed(1) + 'x';
    act.style.color = on ? '#ff5d5d' : '#3ddc84';
  }
}, 200);

// ---------- Botones ----------
$('btnConnect').addEventListener('click', connect);
$('btnDisc').addEventListener('click', disconnect);
$('btnFreeze').addEventListener('click', () => {
  frozen = !frozen;
  $('btnFreeze').textContent = frozen ? 'Reanudar' : 'Congelar';
});
$('btnCal').addEventListener('click', () => {
  calVals = []; calEnd = performance.now() + 3000; calibrating = true;
});
$('btnCsv').addEventListener('click', saveCsv);
$('btnClear').addEventListener('click', clearAll);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && device && device.gatt.connected) keepAwake();
});

if (!navigator.bluetooth) {
  $('warn').textContent = 'Este navegador no soporta Web Bluetooth. Usa Chrome en Android o en escritorio, con la pagina abierta por HTTPS o localhost.';
  $('btnConnect').disabled = true;
}
</script>
</body>
</html>
